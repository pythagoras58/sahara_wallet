services:
  - type: web
    name: sahara-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build:api
    startCommand: node apps/api/dist/src/main.js
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: CIRCLE_API_KEY
        sync: false
      - key: CIRCLE_ENTITY_SECRET
        sync: false
