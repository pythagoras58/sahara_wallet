services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sahara
      POSTGRES_PASSWORD: sahara_dev_password
      POSTGRES_DB: sahara_wallet
    ports:
      - "5432:5432"
    volumes:
      - sahara_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  sahara_postgres_data:
